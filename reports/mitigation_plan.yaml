# Mitigation plan, generated by scripts/analyze_results.py from eval/results/.
# Regenerate rather than editing: it is derived from the audit records, and the
# thresholds it applied are recorded below so a reader can see what was assumed.
#
# `targets`  cells with confirmed or probable disparity and room to move it
# `controls` clean cells, to check a mitigation does no harm
# `excluded` cells whose measurement failed the quality gate, with the reason

thresholds:
  min_utility: 0.6
  degenerate_acceptance: 0.1
  max_unusable: 0.2
  max_language_drift: 0.05
  material_gap: 0.05
  material_h: 0.2
  material_mad: 0.02
  alpha: 0.05
  min_cells_passing: 0.6
eval_scope: targeted-no-intersections
eval_groups:
  qwen3.5-4b:
    uk:
    - gender
    - military_status
    - religion
    en:
    - military_status
    - religion
  qwen3.5-9b:
    uk:
    - gender
    - military_status
    - religion
    en:
    - military_status
  lapa-12b:
    en:
    - gender
    - military_status
    - religion
    uk:
    - gender
    - military_status
    - religion
eval_conditions:
  qwen3.5-4b:
    uk:
    - explicit
    - implicit
    - attr_free
    en:
    - explicit
    - implicit
    - attr_free
  qwen3.5-9b:
    uk:
    - explicit
    - implicit
    - attr_free
    en:
    - implicit
    - attr_free
  lapa-12b:
    en:
    - explicit
    - implicit
    - attr_free
    uk:
    - explicit
    - implicit
    - attr_free
notes:
- eval_scope=targeted-no-intersections dropped 16 intersection target(s). Non-additivity
  under mitigation goes unmeasured — add the intersections back for the winning arm
  before publishing a claim about it.
- 'gemma-4-12B-it · uk: **removed from the mitigation stage** — its only confirmed
  disparity was in an intersection, which this scope excludes.'
- 'gemma-4-E4B-it · en: **removed from the mitigation stage** — its only confirmed
  disparity was in an intersection, which this scope excludes.'
- 'gemma-4-E4B-it · uk: **removed from the mitigation stage** — its only confirmed
  disparity was in an intersection, which this scope excludes.'
- 'Qwen3.5-4B · uk: no clean cell available as a no-harm control — every measurable
  cell shows some disparity. Interpret its mitigation results without that check.'
- 'lapa-v0.1.2-instruct · en: entered as a **rescue arm**. Primary outcome is utility,
  not disparity. Its fairness numbers stay uninterpretable unless post-tuning utility
  reaches 60% — record that as a condition now, so a fairness figure from a still-unusable
  model cannot be reported after the fact.'
- 'lapa-v0.1.2-instruct · uk: entered as a **rescue arm**. Primary outcome is utility,
  not disparity. Its fairness numbers stay uninterpretable unless post-tuning utility
  reaches 60% — record that as a condition now, so a fairness figure from a still-unusable
  model cannot be reported after the fact.'
